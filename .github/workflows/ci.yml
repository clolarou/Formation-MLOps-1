name: Python package
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # À compléter, dans cet ordre :
      # 1. installer Python, dans une version compatible avec pyproject.toml ;
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15"
          check-latest: true
      # 2. installer uv 0.13.5 ;
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
      # 3. installer les dépendances verrouillées ;
      - name: Install dependencies
        run: uv sync --locked
      # 4. vérifier le code avec Ruff (src, tests, docs) ;
      - name: Lint with Ruff
        run: uv run ruff check src tests docs
      # 5. vérifier la mise en forme sans modifier les fichiers
      - name: Check formatting
        run: uv run ruff format --check src tests docs
      # 6. lancer les tests ;
      - name: Run tests
        run: uv run python -m pytest
      # 7. construire la documentation, en traitant les avertissements comme des erreurs.
      - name: Build documentation
        run: uv run sphinx-build -W -b html docs docs/_build/html
      # 8. analyser la sécurité du code avec Bandit ;
      - name: Security analysis with Bandit
        run: uv run bandit -c pyproject.toml -r src scripts
      # 9. détecter le code mort avec Vulture (configuration dans pyproject.toml) ;
      - name: Dead code detection with Vulture
        run: uv run vulture
      # 10. analyser les vulnérabilités des dépendances (uv.lock) avec Trivy.
      - name: Scan dependencies with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml
          version: v0.76.1
